<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Powerlifting Coach</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a1628;
            --card: #132239;
            --text: #eaf0fb;
            --accent: #1e88e5;
            --accent-hover: #1565c0;
            --danger: #e53935;
            --secondary: #1f2a3f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #ffffff;
            text-align: center;
        }
        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .section { display: none; }
        .section.active { display: block; }
        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 0;
        }
        /* Сетка по две кнопки */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .btn {
            background: var(--secondary);
            border: none;
            border-radius: 10px;
            padding: 16px 10px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .btn:active {
            transform: scale(0.96);
            background: var(--accent);
            color: white;
        }
        .btn.accent {
            background: var(--accent);
            color: white;
            font-weight: 600;
        }
        .btn.accent:active {
            background: var(--accent-hover);
        }
        .btn.danger {
            background: var(--danger);
            color: white;
        }
        .btn.danger:active { background: #c62828; }
        .btn.small {
            padding: 10px 12px;
            font-size: 14px;
        }
        /* Карточки */
        .card {
            background: var(--card);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .card strong {
            display: block;
            font-size: 17px;
            margin-bottom: 6px;
        }
        .card p {
            font-size: 14px;
            color: #b0c0d0;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        input, select {
            background: #1e2b3f;
            border: 1px solid #2d3d52;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            color: white;
            width: 100%;
            margin-bottom: 10px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--accent);
        }
        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2b3f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .exercise-item button {
            background: var(--danger);
            border: none;
            color: white;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
        }
        #timer-display {
            font-size: 40px;
            font-weight: 700;
            text-align: center;
            margin: 16px 0;
            color: var(--accent);
        }
        .log-entry { font-size: 14px; margin: 4px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div id="app">
    <!-- Главное меню -->
    <div id="mainMenu" class="section active">
        <h1>🏋️‍♂️ Powerlifting Coach</h1>
        <div class="grid-2">
            <button class="btn" onclick="navigate('programs')">📋 Программы</button>
            <button class="btn" onclick="navigate('custom')">🛠️ Свой сплит</button>
            <button class="btn" onclick="navigate('calc1rm')">🧮 Макс. вес</button>
            <button class="btn" onclick="navigate('calcwork')">⚖️ Рабочий вес</button>
            <button class="btn" onclick="navigate('timer')">⏱️ Таймер</button>
            <button class="btn" onclick="navigate('history')">📈 История</button>
        </div>
    </div>

    <!-- Программы тренировок -->
    <div id="programs" class="section">
        <button class="back-btn" onclick="navigate('mainMenu')">⬅️ Назад</button>
        <h2>Готовые программы</h2>
        <div id="programsList"></div>
        <div id="programDetails" class="hidden"></div>
    </div>

    <!-- Создание своего сплита -->
    <div id="custom" class="section">
        <button class="back-btn" onclick="navigate('mainMenu')">⬅️ Назад</button>
        <h2>Новая тренировка</h2>
        <p>Выберите шаблон:</p>
        <div class="grid-2">
            <button class="btn" onclick="buildSplit('upperlower')">Верх/Низ 4 дня</button>
            <button class="btn" onclick="buildSplit('pushpulllegs')">Push/Pull/Legs</button>
        </div>
        <div id="splitBuilder" class="hidden"></div>
        <div id="exercisePool" class="hidden"></div>
        <button id="saveSplitBtn" class="btn accent hidden" onclick="saveSplit()">💾 Сохранить сплит</button>
    </div>

    <!-- Калькулятор максимального веса (бывший 1ПМ) -->
    <div id="calc1rm" class="section">
        <button class="back-btn" onclick="navigate('mainMenu')">⬅️ Назад</button>
        <h2>Расчёт максимального веса</h2>
        <input type="number" id="rmWeight" placeholder="Рабочий вес (кг)">
        <input type="number" id="rmReps" placeholder="Повторения">
        <button class="btn accent" onclick="calculateMaxWeight()">Рассчитать</button>
        <p id="rmResult" style="margin-top:16px; font-weight:600; font-size:18px;"></p>
    </div>

    <!-- Расчёт рабочего веса -->
    <div id="calcwork" class="section">
        <button class="back-btn" onclick="navigate('mainMenu')">⬅️ Назад</button>
        <h2>Рабочий вес</h2>
        <input type="number" id="oneRM" placeholder="Максимальный вес (1ПМ), кг">
        <input type="number" id="targetReps" placeholder="Желаемые повторения">
        <button class="btn accent" onclick="calculateWorkingWeight()">Рассчитать</button>
        <p id="workResult" style="margin-top:16px; font-weight:600; font-size:18px;"></p>
    </div>

    <!-- Таймер -->
    <div id="timer" class="section">
        <button class="back-btn" onclick="navigate('mainMenu')">⬅️ Назад</button>
        <h2>Таймер отдыха</h2>
        <div class="row">
            <input type="number" id="timerMinutes" placeholder="Минуты" value="2" style="flex:1">
            <input type="number" id="timerSeconds" placeholder="Секунды" value="30" style="flex:1">
        </div>
        <div class="row">
            <button class="btn accent" onclick="startTimer()" style="flex:1">▶️ Старт</button>
            <button class="btn danger" onclick="stopTimer()" style="flex:1">⏹️ Стоп</button>
        </div>
        <div id="timer-display">02:30</div>
    </div>

    <!-- История -->
    <div id="history" class="section">
        <button class="back-btn" onclick="navigate('mainMenu')">⬅️ Назад</button>
        <h2>История тренировок</h2>
        <div id="historyList"></div>
        <button class="btn danger" onclick="clearHistory()" style="margin-top:16px;">🗑️ Очистить историю</button>
    </div>
</div>

<script>
    const app = document.getElementById('app');
    function navigate(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'programs') renderPrograms();
        if (id === 'history') renderHistory();
    }

    // ========== ПРОГРАММЫ ==========
    const programs = [
        {
            name: "Starting Strength",
            desc: "Классическая программа для новичков. Три тренировки в неделю.",
            days: [
                { name: "Тренировка А", exercises: ["Присед 3x5", "Жим лёжа 3x5", "Становая тяга 1x5"] },
                { name: "Тренировка Б", exercises: ["Присед 3x5", "Армейский жим 3x5", "Становая тяга 1x5"] }
            ]
        },
        {
            name: "Madcow 5×5",
            desc: "Линейная прогрессия для среднего уровня.",
            days: [
                { name: "Понедельник", exercises: ["Присед 5x5", "Жим лёжа 5x5", "Тяга штанги в наклоне 5x5"] },
                { name: "Среда", exercises: ["Присед (лёгкий) 5x5", "Армейский жим 5x5", "Становая тяга 5x5"] },
                { name: "Пятница", exercises: ["Присед (тяжёлый) 3x5", "Жим лёжа 3x5", "Тяга штанги в наклоне 3x5"] }
            ]
        },
        {
            name: "Smolov Jr. (жим)",
            desc: "Интенсивная программа для жима лёжа. 3 недели.",
            days: [
                { name: "Неделя 1", exercises: ["Пн: 6x6 @70%", "Ср: 5x5 @75%", "Пт: 4x4 @80%"] },
                { name: "Неделя 2", exercises: ["Пн: 6x6 @75%", "Ср: 5x5 @80%", "Пт: 4x4 @85%"] },
                { name: "Неделя 3", exercises: ["Пн: 6x6 @80%", "Ср: 5x5 @85%", "Пт: 3x3 @90%"] }
            ]
        }
    ];

    function renderPrograms() {
        const list = document.getElementById('programsList');
        document.getElementById('programDetails').classList.add('hidden');
        list.innerHTML = programs.map(p => `
            <div class="card">
                <strong>${p.name}</strong>
                <p>${p.desc}</p>
                <button class="btn accent small" onclick="showProgram('${p.name}')">Подробнее</button>
            </div>
        `).join('');
    }

    function showProgram(name) {
        const prog = programs.find(p => p.name === name);
        if (!prog) return;
        let html = `<h3>${prog.name}</h3><p>${prog.desc}</p>`;
        prog.days.forEach(day => {
            html += `<div class="card"><strong>${day.name}</strong><ul style="padding-left:20px; margin-top:4px;">`;
            day.exercises.forEach(ex => html += `<li>${ex}</li>`);
            html += `</ul></div>`;
        });
        html += `<button class="btn small" onclick="renderPrograms()">⬅️ Назад к списку</button>`;
        document.getElementById('programsList').classList.add('hidden');
        document.getElementById('programDetails').classList.remove('hidden');
        document.getElementById('programDetails').innerHTML = html;
    }

    // ========== СВОЙ СПЛИТ ==========
    let currentSplit = null; // { days: [{ name, exercises: [] }] }
    const upperExercises = ["Жим лёжа", "Армейский жим", "Тяга штанги в наклоне", "Подтягивания", "Жим гантелей"];
    const lowerExercises = ["Приседания", "Становая тяга", "Выпады", "Жим ногами", "Сгибания ног"];
    const pushExercises = ["Жим лёжа", "Армейский жим", "Отжимания на брусьях", "Разводка гантелей"];
    const pullExercises = ["Становая тяга", "Тяга штанги в наклоне", "Подтягивания", "Тяга верхнего блока"];
    const legsExercises = ["Приседания", "Выпады", "Жим ногами", "Сгибания ног", "Разгибания ног"];

    function buildSplit(type) {
        const builder = document.getElementById('splitBuilder');
        builder.classList.remove('hidden');
        document.getElementById('saveSplitBtn').classList.remove('hidden');
        let days = [];
        if (type === 'upperlower') {
            days = [
                { name: "Пн: Верх", exercises: [] },
                { name: "Вт: Низ", exercises: [] },
                { name: "Чт: Верх", exercises: [] },
                { name: "Пт: Низ", exercises: [] }
            ];
        } else if (type === 'pushpulllegs') {
            days = [
                { name: "Пн: Push", exercises: [] },
                { name: "Ср: Pull", exercises: [] },
                { name: "Пт: Legs", exercises: [] }
            ];
        }
        currentSplit = { type, days };
        renderSplitBuilder();
    }

    function renderSplitBuilder() {
        const builder = document.getElementById('splitBuilder');
        let html = '';
        currentSplit.days.forEach((day, idx) => {
            const pool = getExercisePool(day.name);
            html += `<div class="card">
                <strong>${day.name}</strong>
                <div id="day-${idx}-exercises">${day.exercises.map((ex,i) => `
                    <div class="exercise-item">
                        <span>${ex.name} ${ex.sets}x${ex.reps} @${ex.weight}кг</span>
                        <button onclick="removeExercise(${idx},${i})">✕</button>
                    </div>
                `).join('')}</div>
                <div class="row" style="margin-top:8px;">
                    <select id="ex-select-${idx}" style="flex:1;">${pool.map(e => `<option>${e}</option>`).join('')}</select>
                    <input type="number" id="sets-${idx}" placeholder="Подх." value="3" style="width:60px;">
                    <input type="number" id="reps-${idx}" placeholder="Повт." value="8" style="width:60px;">
                    <input type="number" id="weight-${idx}" placeholder="Кг" value="60" style="width:70px;">
                </div>
                <button class="btn small accent" onclick="addExercise(${idx})">➕ Добавить</button>
            </div>`;
        });
        builder.innerHTML = html;
    }

    function getExercisePool(dayName) {
        if (dayName.includes('Верх') || dayName.includes('Push')) return upperExercises.concat(pushExercises);
        if (dayName.includes('Низ') || dayName.includes('Legs')) return lowerExercises.concat(legsExercises);
        if (dayName.includes('Pull')) return pullExercises;
        return [...upperExercises, ...lowerExercises];
    }

    function addExercise(dayIdx) {
        const select = document.getElementById(`ex-select-${dayIdx}`);
        const sets = document.getElementById(`sets-${dayIdx}`).value;
        const reps = document.getElementById(`reps-${dayIdx}`).value;
        const weight = document.getElementById(`weight-${dayIdx}`).value;
        if (!sets || !reps || !weight) return alert('Заполните подходы, повторения и вес');
        const name = select.value;
        currentSplit.days[dayIdx].exercises.push({ name, sets, reps, weight });
        renderSplitBuilder();
    }

    function removeExercise(dayIdx, exIdx) {
        currentSplit.days[dayIdx].exercises.splice(exIdx, 1);
        renderSplitBuilder();
    }

    function saveSplit() {
        const history = JSON.parse(localStorage.getItem('powerHistory') || '[]');
        history.unshift({
            date: new Date().toLocaleString(),
            type: currentSplit.type,
            days: currentSplit.days
        });
        localStorage.setItem('powerHistory', JSON.stringify(history));
        alert('Сплит сохранён в истории!');
    }

    // ========== КАЛЬКУЛЯТОРЫ ==========
    function calculateMaxWeight() {
        const w = parseFloat(document.getElementById('rmWeight').value);
        const r = parseInt(document.getElementById('rmReps').value);
        if (!w || !r) return;
        const max = w * (1 + r / 30);
        document.getElementById('rmResult').innerHTML = `Максимальный вес: <strong>${max.toFixed(1)} кг</strong>`;
    }

    function calculateWorkingWeight() {
        const oneRM = parseFloat(document.getElementById('oneRM').value);
        const reps = parseInt(document.getElementById('targetReps').value);
        if (!oneRM || !reps) return;
        const weight = oneRM * 30 / (30 + reps);
        document.getElementById('workResult').innerHTML = `Вес на ${reps} повт.: <strong>${weight.toFixed(1)} кг</strong>`;
    }

    // ========== ТАЙМЕР ==========
    let timerInterval;
    function startTimer() {
        clearInterval(timerInterval);
        let m = parseInt(document.getElementById('timerMinutes').value) || 0;
        let s = parseInt(document.getElementById('timerSeconds').value) || 0;
        let total = m * 60 + s;
        if (total <= 0) return;
        timerInterval = setInterval(() => {
            if (total <= 0) {
                clearInterval(timerInterval);
                try { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                return;
            }
            total--;
            const min = Math.floor(total / 60);
            const sec = total % 60;
            document.getElementById('timer-display').textContent = 
                `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }, 1000);
    }
    function stopTimer() {
        clearInterval(timerInterval);
    }

    // ========== ИСТОРИЯ ==========
    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('powerHistory') || '[]');
        const list = document.getElementById('historyList');
        list.innerHTML = history.map(entry => {
            if (entry.exercises) { // старая версия
                return `<div class="card">
                    <strong>${entry.date}</strong>
                    ${entry.exercises.map(e => `<div class="log-entry">${e.name}: ${e.sets}x${e.reps} @${e.weight}кг</div>`).join('')}
                </div>`;
            } else if (entry.days) {
                let daysHtml = entry.days.map(d => `<div><em>${d.name}</em><br/>${d.exercises.map(ex => `${ex.name} ${ex.sets}x${ex.reps} @${ex.weight}кг`).join('<br/>')}</div>`).join('<br/>');
                return `<div class="card"><strong>${entry.date}</strong><br/>${daysHtml}</div>`;
            }
            return '';
        }).join('');
    }
    function clearHistory() {
        localStorage.removeItem('powerHistory');
        renderHistory();
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
</script>
</body>
</html>
